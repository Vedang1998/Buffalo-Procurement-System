name: Hosted synthetic acceptance diagnostic

on:
  push:
    branches: [codex/hosted-synthetic-acceptance]

permissions:
  contents: read

jobs:
  capability-preflight:
    if: github.repository == 'Vedang1998/Buffalo-Procurement-System' && github.event_name == 'push' && github.ref == 'refs/heads/codex/hosted-synthetic-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted source before repository code
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = Vedang1998/Buffalo-Procurement-System
          test "$EXPECTED_EVENT" = push
          test "$EXPECTED_REF" = refs/heads/codex/hosted-synthetic-acceptance
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if git symbolic-ref --quiet HEAD; then exit 1; fi
          git merge-base --is-ancestor cb0969059b0b85241d611124910d691e49212881 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          observed_tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$observed_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_commit=%s\nsource_tree=%s\n' "$EXPECTED_SHA" "$observed_tree"

      - name: Prepare Python for the diagnostic
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
          architecture: x64
          check-latest: false
          update-environment: false

      - name: Read-only target ownership-scan prerequisites
        shell: bash
        env:
          DIAGNOSTIC_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Observe only. No sudo, traversal, namespace operation or account.
          diagnostic=$(env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 "$DIAGNOSTIC_PYTHON" -I -S -B -c 'import json,pathlib,sys; sys.path.insert(0,"procurement/tools"); from hosted_synthetic_source import bind_hosted_source; from hosted_synthetic_account_preflight import observe_scan_host; binding=bind_hosted_source(pathlib.Path.cwd(),repository=sys.argv[1],event=sys.argv[2],ref=sys.argv[3],sha=sys.argv[4]); report=observe_scan_host(binding); raw=json.dumps(report,sort_keys=True,separators=(",",":")); assert len(raw)<=16384; print(raw)' "$EXPECTED_REPOSITORY" "$EXPECTED_EVENT" "$EXPECTED_REF" "$EXPECTED_SHA")
          # Begin bounded public inventory. No raw paths, mount options or credentials.
          test "${#diagnostic}" -le 16384
          digest=$(printf '%s' "$diagnostic" | sha256sum)
          digest=${digest%% *}
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          payload=$(printf '%s' "$diagnostic" | base64 --wrap=0)
          count=$(( (${#payload} + 2999) / 3000 ))
          test "$count" -ge 1 && test "$count" -le 8
          for (( index=0; index<count; index++ )); do
            printf '::notice title=Read-only ownership-scan inventory::v1 index=%s count=%s sha256=%s data=%s\n' "$index" "$count" "$digest" "${payload:index*3000:3000}"
          done
          # End bounded public inventory.

      - name: Read-only native artifact reconciliation inputs
        shell: bash
        env:
          DIAGNOSTIC_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Static metadata and dpkg claims only; never publisher authentication.
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          status=0
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 IMAGE_OS="${ImageOS:-}" IMAGE_VERSION="${ImageVersion:-}" /usr/bin/timeout --signal=TERM --kill-after=2s 60s "$DIAGNOSTIC_PYTHON" -I -S -B procurement/tools/hosted_synthetic_native_observation.py "$EXPECTED_SHA" > "$report" || status=$?
          if test "$status" != 0; then
            printf '{"status":"INCOMPLETE_OBSERVATION","commit":"%s","process_status":%s,"execution_authority":false}' "$EXPECTED_SHA" "$status" > "$report"
          fi
          test -s "$report" && test "$(wc -c < "$report")" -le 65536
          diagnostic=$(cat "$report")
          digest=$(printf '%s' "$diagnostic" | sha256sum)
          digest=${digest%% *}
          payload=$(printf '%s' "$diagnostic" | base64 --wrap=0)
          count=$(( (${#payload} + 2999) / 3000 ))
          test "$count" -ge 1 && test "$count" -le 30
          for (( index=0; index<count; index++ )); do
            printf '::notice title=Native artifact target observation::v1 index=%s count=%s sha256=%s data=%s\n' "$index" "$count" "$digest" "${payload:index*3000:3000}"
          done
          # Incomplete observations remain explicit and cannot authorize capture.
          # Continue independent focused tests; the unconditional review gate stays closed.

      - name: Focused source and diagnostic validation
        shell: bash
        env:
          DIAGNOSTIC_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          # Diagnostic protocol interpreter only; never the accepted browser runtime.
          diagnostic_node=$(command -v node)
          test -n "$diagnostic_node"
          test -x "$diagnostic_node"
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 "$diagnostic_node" --version
          sha256sum "$diagnostic_node"
          # Locked-app packet-authority tests remain in the authoritative app suite;
          # this credential-free diagnostic step deliberately has no site packages.
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 BUFFALO_DIAGNOSTIC_NODE="$diagnostic_node" "$DIAGNOSTIC_PYTHON" -I -S -B - <<'PYTHON'
          import pathlib,sys,unittest,json,base64,hashlib,re,traceback
          root=pathlib.Path.cwd(); sys.path[:0]=[str(root/"procurement/tools"),str(root/"procurement/tests")]
          # Begin bounded result observer.
          class PublicResult(unittest.TextTestResult):
              def __init__(self,*args,**kwargs):
                  super().__init__(*args,**kwargs); self.successes=0; self.observations=[]; self.omitted=0
              def addSuccess(self,test):
                  super().addSuccess(test); self.successes+=1
              def observe(self,test,error,kind):
                  if len(self.observations)>=16: self.omitted+=1; return
                  case=getattr(test,"_test_case",test)
                  name=".".join((type(case).__module__,type(case).__name__,getattr(case,"_testMethodName","UNREGISTERED")))
                  if not re.fullmatch(r"[A-Za-z0-9_.]{1,240}",name): name="UNREGISTERED"
                  error_type=error[0].__name__
                  if not re.fullmatch(r"[A-Za-z0-9_]{1,80}",error_type): error_type="UNREGISTERED"
                  frames=[]
                  for frame in traceback.extract_tb(error[2]):
                      try: relative=pathlib.Path(frame.filename).resolve().relative_to(root).as_posix()
                      except (ValueError,OSError): continue
                      if relative.startswith(("procurement/tools/","procurement/tests/")) and re.fullmatch(r"[A-Za-z0-9_./-]{1,240}",relative):
                          frames.append({"file":relative,"line":frame.lineno})
                  self.observations.append({"test":name,"kind":kind,"exception":error_type,"frames":frames[-3:]})
              def addError(self,test,error):
                  super().addError(test,error); self.observe(test,error,"ERROR")
              def addFailure(self,test,error):
                  super().addFailure(test,error); self.observe(test,error,"FAILURE")
              def addSubTest(self,test,subtest,error):
                  super().addSubTest(test,subtest,error)
                  if error is not None: self.observe(test,error,"SUBTEST_EVENT")
          def public_summary(result,discovered):
              return {"discovered":discovered,"executed":result.testsRun,"passed_methods":result.successes,
                      "failure_events":len(result.failures),"error_events":len(result.errors),"skipped":len(result.skipped),
                      "expected_failures":len(result.expectedFailures),"unexpected_successes":len(result.unexpectedSuccesses),
                      "observations":result.observations,"omitted_observations":result.omitted,
                      "scope":"DIAGNOSTIC_TESTS_ONLY_NO_LIVE_PROOF"}
          # End bounded result observer.
          modules=[unittest.defaultTestLoader.loadTestsFromName(name) for name in ["test_hosted_synthetic_source","test_hosted_synthetic_capability","test_hosted_synthetic_workflow","test_hosted_synthetic_namespace","test_hosted_synthetic_projection","test_hosted_synthetic_cgroup","test_hosted_synthetic_host","test_hosted_synthetic_user_service","test_hosted_synthetic_enrollment","test_hosted_synthetic_bootstrap","test_hosted_synthetic_identity","test_hosted_synthetic_pid1_regression","test_hosted_synthetic_runtime","test_hosted_synthetic_worker","test_hosted_synthetic_observer","test_hosted_synthetic_quarantine","test_hosted_synthetic_wheels","test_hosted_synthetic_application_runtime","test_hosted_synthetic_lifecycle","test_hosted_synthetic_apply_step","test_hosted_synthetic_mapping_step","test_hosted_synthetic_review_step","test_hosted_synthetic_prepare_step","test_hosted_synthetic_page_adapter","test_hosted_synthetic_download","test_hosted_synthetic_artifacts","test_hosted_synthetic_packet_controls","test_hosted_synthetic_packet_evidence","test_hosted_synthetic_packet_forecast","test_hosted_synthetic_restart_evidence","test_hosted_synthetic_recovery_toc","test_hosted_synthetic_recovery_inputs","test_hosted_synthetic_recovery_storage","test_hosted_synthetic_postgres_runtime","test_hosted_synthetic_postgres_identity","test_hosted_synthetic_native_core","test_hosted_synthetic_postgres_image","test_hosted_synthetic_account_preflight","test_hosted_synthetic_postgres_version","test_hosted_synthetic_namespace_prerequisite","test_hosted_synthetic_native_inputs"]]; assert [item.countTestCases() for item in modules] == [38,33,17,66,22,38,20,11,17,37,27,23,36,14,34,10,23,14,28,15,20,23,21,28,18,26,23,21,22,16,24,26,17,89,36,16,35,46,35,14,32]; suite=unittest.TestSuite(modules)
          discovered=suite.countTestCases(); result=unittest.TextTestRunner(verbosity=2,resultclass=PublicResult).run(suite)
          raw=json.dumps(public_summary(result,discovered),sort_keys=True,separators=(",",":")).encode(); assert len(raw)<=32768
          payload=base64.b64encode(raw).decode(); digest=hashlib.sha256(raw).hexdigest(); count=(len(payload)+2999)//3000
          for index in range(count): print(f"::notice title=Focused diagnostic result::v1 index={index} count={count} sha256={digest} data={payload[index*3000:(index+1)*3000]}")
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 1111 and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses else 1)
          PYTHON

      - name: Read-only PostgreSQL phase capture and memory measurement
        shell: bash
        env:
          DIAGNOSTIC_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          status=0
          # Fixed component only: memfd capture/codec/adoption, no native PG execution.
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 /usr/bin/timeout --signal=TERM --kill-after=2s 60s "$DIAGNOSTIC_PYTHON" -I -S -B procurement/tools/hosted_synthetic_runtime_regression.py --measure-postgres-phase "$EXPECTED_SHA" > "$report" || status=$?
          if test "$status" = 124 || test "$status" = 137; then
            printf '{"capture_fit":"OUTER_TIMEOUT","commit":"%s","owned_cleanup":"UNVERIFIED","execution_authority":false}' "$EXPECTED_SHA" > "$report"
          fi
          test -s "$report"
          test "$(wc -c < "$report")" -le 16384
          diagnostic=$(cat "$report")
          # Begin bounded public capture measurement.
          test "${#diagnostic}" -le 16384
          digest=$(printf '%s' "$diagnostic" | sha256sum)
          digest=${digest%% *}
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          payload=$(printf '%s' "$diagnostic" | base64 --wrap=0)
          count=$(( (${#payload} + 2999) / 3000 ))
          test "$count" -ge 1 && test "$count" -le 8
          for (( index=0; index<count; index++ )); do
            printf '::notice title=PostgreSQL capture memory component::v1 index=%s count=%s sha256=%s data=%s\n' "$index" "$count" "$digest" "${payload:index*3000:3000}"
          done
          # End bounded public capture measurement.
          exit "$status"

      - name: Review gate before hosted execution
        shell: bash
        env:
          DIAGNOSTIC_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Required independent review is not a caller-supplied PASS flag.
          # This entry always exits78 before any live service or privilege call.
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 "$DIAGNOSTIC_PYTHON" -I -S -B procurement/tools/hosted_synthetic_bootstrap.py
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          status=0
          # Begin owned user-service diagnostic. No privileged manager is used.
          uid=$(id -u)
          nonce=$(cat /proc/sys/kernel/random/uuid)
          [[ "$nonce" =~ ^[0-9a-f-]{36}$ ]]
          unit="buffalo-hosted-$nonce.service"
          manager_env=(/usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus")
          "${manager_env[@]}" /usr/bin/timeout --signal=TERM --kill-after=5s 150s /usr/bin/systemd-run --user --quiet --wait --pipe --collect --service-type=exec --expand-environment=no --unit="$unit" --slice=app.slice --working-directory="$(pwd -P)" --property='Delegate=memory pids' --property=DelegateSubgroup=supervisor --property=RuntimeMaxSec=120s --property=TimeoutStartSec=10s --property=TimeoutStopSec=5s --property=KillMode=control-group --property=NoNewPrivileges=yes --property=MemoryMax=512M --property=TasksMax=64 \
            /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 "$DIAGNOSTIC_PYTHON" -I -S -B -c 'import subprocess,sys; raise SystemExit(subprocess.run([sys.executable,"-I","-S","-B","procurement/tools/hosted_synthetic_capability.py",*sys.argv[1:]],close_fds=True,env={"PATH":"/usr/bin:/bin","LC_ALL":"C.UTF-8"},timeout=110).returncode)' "$EXPECTED_REPOSITORY" "$EXPECTED_EVENT" "$EXPECTED_REF" "$EXPECTED_SHA" --user-service-unit "$unit" > "$report" || status=$?
          client_status=$status
          unit_cleanup=UNVERIFIED
          for attempt in 1 2 3 4 5; do
            query_status=0
            load_state=$("${manager_env[@]}" /usr/bin/timeout --signal=TERM --kill-after=1s 3s /usr/bin/systemctl --user show "$unit" --property=LoadState --value 2>/dev/null) || query_status=$?
            if test "$load_state" = not-found && { test "$query_status" = 0 || test "$query_status" = 1; }; then unit_cleanup=NOT_FOUND_OBSERVED; break; fi
            sleep 0.1
          done
          case "$client_status" in 0|1) ;; *) unit_cleanup=UNVERIFIED ;; esac
          printf '::notice title=Owned user-service lifecycle::unit=%s load_state=%s client_status=%s\n' "$unit" "$unit_cleanup" "$client_status"
          if test "$unit_cleanup" != NOT_FOUND_OBSERVED; then status=1; fi
          # End owned user-service diagnostic. Never stop an unbound unit name.
          test -s "$report"
          test "$(wc -c < "$report")" -le 65536
          cat "$report"
          printf '```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          diagnostic=$(head -n 1 "$report")
          test "${#diagnostic}" -le 16384
          digest=$(printf '%s' "$diagnostic" | sha256sum)
          digest=${digest%% *}
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          payload=$(printf '%s' "$diagnostic" | base64 --wrap=0)
          count=$(( (${#payload} + 2999) / 3000 ))
          test "$count" -ge 1 && test "$count" -le 8
          for (( index=0; index<count; index++ )); do
            printf '::notice title=Buffalo diagnostic part::v1 index=%s count=%s sha256=%s data=%s\n' "$index" "$count" "$digest" "${payload:index*3000:3000}"
          done
          exit "$status"

      - name: Credential-free real PID1 lifecycle regression
        shell: bash
        env:
          DIAGNOSTIC_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          status=0
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 "$DIAGNOSTIC_PYTHON" -I -S -B procurement/tools/hosted_synthetic_pid1_regression.py --run-pid1-regressions > "$report" || status=$?
          test "$(wc -c < "$report")" -le 16384
          cat "$report"
          digest=$(sha256sum "$report")
          digest=${digest%% *}
          printf '::notice title=Real PID1 lifecycle result::exit=%s sha256=%s scope=REAL_PID_NAMESPACE_SIMULATED_CGROUP_ONLY\n' "$status" "$digest"
          # exit78 means NOT_RUN, never a passing replacement for a kernel test.
          exit "$status"
