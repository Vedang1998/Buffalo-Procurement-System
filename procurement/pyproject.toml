[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buffalo-procurement-os"
version = "1.3.0"
description = "Buffalo House Procurement OS — catalog and historical-sales foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
